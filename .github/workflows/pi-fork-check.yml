name: Pi Fork Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pi-fork-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fork-contract:
    if: github.repository == 'chenhaoxiang/pi-lobehub'
    name: fork-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install isolated policy parser without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund --prefix tmp/fork-ci-tools yaml@2.9.0 vitest@5.0.0 debug@4.4.3 react@19.2.7 react-dom@19.2.7 @testing-library/react@16.3.3 @testing-library/dom@10.4.2 happy-dom@20.11.15 es-toolkit@1.50.0
      - name: Check inherited workflow isolation and policy regressions
        env:
          NODE_PATH: ${{ github.workspace }}/tmp/fork-ci-tools/node_modules
        run: |
          node --test .github/scripts/forkWorkflowPolicy.test.mjs
          node --test scripts/piLocalFixture.test.mjs
          node .github/scripts/forkWorkflowPolicy.mjs
      - name: Check Pi RPC framing, version, identity and question regressions
        run: node tmp/fork-ci-tools/node_modules/vitest/vitest.mjs run --config .github/scripts/piRpcChecks.config.mjs

  task-goal-closure:
    if: github.repository == 'chenhaoxiang/pi-lobehub'
    name: task-goal-closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      npm_config_manage_package_manager_versions: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install pinned workspace tools without lifecycle scripts
        run: |
          npm install --ignore-scripts --no-audit --no-fund --prefix tmp/workspace-ci-tools pnpm@12.4.1 @oven/bun-linux-x64@1.4.4
          echo "$GITHUB_WORKSPACE/tmp/workspace-ci-tools/node_modules/@oven/bun-linux-x64/bin" >> "$GITHUB_PATH"
      - name: Install root workspace only (no CLI, credentials or release scripts)
        run: node tmp/workspace-ci-tools/node_modules/pnpm/bin/pnpm.mjs install --ignore-scripts --child-concurrency=1 --network-concurrency=4
      - name: Check Task, Goal, ownership, verification and rework regressions
        run: >-
          node node_modules/vitest/vitest.mjs run --project server --maxWorkers=3
          apps/server/src/services/taskRunner
          apps/server/src/services/taskLifecycle
          apps/server/src/services/taskResultBridge
          apps/server/src/services/taskGraph
          apps/server/src/services/goal/advanceGoal.test.ts
          apps/server/src/services/goal/scheduler
          apps/server/src/services/goal/assignment.taskOwner.test.ts
          apps/server/src/services/goal/GoalService/__tests__/dispatch.test.ts
          apps/server/src/services/goal/GoalService/__tests__/currentExecutions.test.ts
          apps/server/src/services/goal/GoalService/__tests__/recovery.test.ts
          apps/server/src/services/goal/GoalService/__tests__/rework.test.ts
          apps/server/src/services/goal/GoalService/__tests__/seedDependencies.test.ts
          apps/server/src/services/verify/settle.ownership.test.ts
          apps/server/src/services/verify/__tests__/driveTaskFromVerify.test.ts
          apps/server/src/services/verify/__tests__/acceptanceTaskLifecycle.test.ts
          apps/server/src/services/verify/__tests__/acceptanceDecision.test.ts
          apps/server/src/services/verify/__tests__/acceptanceActor.test.ts
          apps/server/src/services/verify/__tests__/acceptanceSettledCheck.test.ts
          apps/server/src/services/verify/__tests__/acceptanceLifecycle.test.ts
          apps/server/src/services/verify/__tests__/carryForward.db.test.ts
          apps/server/src/routers/lambda/verify/index.test.ts
          apps/server/src/routers/lambda/__tests__/integration/task.engineering.integration.test.ts
          apps/server/src/routers/lambda/__tests__/integration/task.currentUsage.integration.test.ts
          apps/server/src/services/heterogeneousAgent/HeterogeneousPersistenceHandler
          apps/server/src/services/taskEngineering
      - name: Check goal status, attention, rework copy and required user guidance
        run: >-
          node node_modules/vitest/vitest.mjs run --project app --maxWorkers=3
          src/features/AgentGoals/ProcessControl
          src/features/Portal/GoalMetric
          src/features/AgentGoals/GoalDecision/mapping.test.ts
          src/features/GlobalApprovalNotification
          src/store/home/slices/inbox/action.taskInteractions.test.ts
          src/store/home/slices/inbox/action.test.ts
          src/store/task/slices/detail
          src/store/task/selectors/detailSelectors.test.ts
          src/features/AgentTasks/AgentTaskDetail
      - name: Check real database run claims and owner isolation
        working-directory: packages/database
        run: >-
          node ../../node_modules/vitest/vitest.mjs run --maxWorkers=3 --silent='passed-only'
          src/models/__tests__/task.runClaim.test.ts
          src/models/__tests__/taskTopic.takeOver.test.ts
          src/models/__tests__/taskTopic.reopenSettledRun.test.ts
          src/models/__tests__/taskTopic.currentRun.test.ts
          src/models/__tests__/agentOperation.executionFacts.test.ts
          src/models/__tests__/taskAttention.test.ts
          src/models/__tests__/taskUsage.test.ts
          src/models/__tests__/taskEngineering.test.ts
      - name: Check Pi usage buckets and missing telemetry regressions
        working-directory: packages/heterogeneous-agents
        run: node ../../node_modules/vitest/vitest.mjs run --maxWorkers=3 src/adapters/pi.test.ts src/adapters/pi.usage.test.ts
      - name: Check application and new regression types
        run: bun run type-check && node_modules/.bin/tsrs --noEmit -p .github/scripts/piTaskGoalTypes.json --checkers 4
